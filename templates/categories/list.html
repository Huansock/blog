{% extends "base.html" %}
{% block content %}
    <p><a href="{{ get_url(path='') }}">← 첫 화면으로 돌아가기</a></p>
    <h1>모든 범주</h1>
    <ul>
        {% for term in terms %}
            <li>
                <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
                <span>({{ term.pages | length }}개의 글)</span>
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
